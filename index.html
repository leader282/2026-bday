<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Countdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Video Container -->
  <div class="video-layer">
    <!-- Background Video -->
    <video id="bgVideo" playsinline loop>
      <source src="videos/stage.mp4" type="video/mp4" />
    </video>

    <!-- Overlay Walking Video -->
    <video id="walkVideo" autoplay muted loop playsinline>
      <source src="videos/walking.mp4" type="video/mp4" />
    </video>
  </div>


  <!-- Overlay -->
  <div class="overlay">
    <h1 id="mainTitle">Until The Special Day</h1>

    <div class="timer">
      <div class="time-box">
        <span id="days">0</span>
        <small>Days</small>
      </div>
      <div class="time-box">
        <span id="hours">0</span>
        <small>Hours</small>
      </div>
      <div class="time-box">
        <span id="minutes">0</span>
        <small>Minutes</small>
      </div>
      <div class="time-box">
        <span id="seconds">0</span>
        <small>Seconds</small>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
